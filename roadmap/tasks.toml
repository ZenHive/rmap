[[task]]
id = 29
phase = 15
bundle = "schema_milestones"
status = "done"
title = "rmap new allocates a colliding task id on a string-id roadmap"
scores = { d = 3, b = 7, u = 6 }
markers = ["bug"]
acceptance_criteria = ['`rmap new` on a string-id roadmap (`id = "1"`) allocates max+1, not 1', "An auto-allocated id is serialized in the roadmap's existing form — string for a string-id file, integer for an integer-id file", "Integer-id roadmaps (rmap's own) are byte-identical — no regression", "Unit tests cover string-id allocation, string-id serialization, and integer-id no-regression"]
body = """
`next_task_id` (src/mutate.rs) computed the next auto-allocated id by scanning existing tasks with `value.as_integer()` — which matches only TOML integer-typed ids. `TaskId` is dual-form: a roadmap may store ids as integers (`id = 28`, rmap's own convention) or as numeric strings (`id = "28"`, the convention harness's roadmap uses). On a string-id roadmap every `as_integer()` returned `None`, so `max` stayed 0 and `next_task_id` returned 1 — silently allocating a task whose id collided with the existing `id = "1"`. The colliding task was unreachable by `rmap show`, and `rmap validate` did not catch it because duplicate detection keys on `TaskId`, whose `Number(1)` and `Text("1")` are distinct values.

A second defect compounded it: the allocated id was always serialized as a TOML integer, so even a corrected allocation would write `id = 29` into a file of `id = "28"` strings, drifting the id type.

Fix `next_task_id` to count both integer and numeric-string ids, and serialize an auto-allocated id in the form the roadmap already uses so `rmap new` never mixes the two within one file. Surfaced while filing audit follow-up tasks into the harness roadmap (a string-id roadmap) — the same class of bug as the earlier f09ac55 incident.
"""
implemented = "Fixed next_task_id to count numeric-string ids (new task_id_value_as_u32 helper) so a string-id roadmap continues its sequence instead of restarting at 1; add_task_str serializes the allocated id in the file's existing form (new ids_are_string_typed helper) so integer and string id forms are never mixed within one file. 3 unit tests in mutate.rs cover string-id allocation, string-id serialization, and integer-id no-regression. Full cargo test suite + clippy green."
created_at = "2026-05-22"
scored_at = "2026-05-22"
done_at = "2026-05-22"

[[task]]
id = 30
phase = 15
bundle = "schema_milestones"
status = "done"
title = "rmap validate does not detect duplicate task ids"
scores = { d = 3, b = 6, u = 5 }
markers = ["bug"]
acceptance_criteria = ["`rmap validate` fails a roadmap with two tasks sharing an id", 'A collision between an integer id and the string form of the same number (`id = 1` vs `id = "1"`) is detected', "A decision is recorded on whether `TaskId`'s `Eq`/`Hash` should normalize numeric-string ids, fixing dependency / cycle validation on mixed-form files", "Tests cover same-form and cross-form duplicate detection"]
out_of_scope = ["Auto-repairing a duplicated id — validation only reports"]
body = """
`validate_tasks_str` (src/validate.rs) runs sixteen semantic checks but none asserts that task ids are unique. A roadmap with two tasks sharing an id — from a hand-edit, a botched `rmap import`, or a mutator bug — passes `rmap validate` clean. The integrity gate should reject a duplicated primary key.

The check is complicated by `TaskId` being dual-form (`Number(u32)` | `Text(String)`) with derived `Eq`/`Hash`: `Number(1)` and `Text("1")` hash and compare as distinct, so a naive `HashSet<TaskId>` would miss an `id = 1` / `id = "1"` collision. The same duality already makes `validate_dependencies` and `validate_dependency_cycles` latently wrong on a mixed-form file — a `depends_on` entry whose form differs from the target id's reads as an unknown task.

Add a `validate_unique_ids` check that normalizes each id to a canonical key (numeric-string ids fold to their number) before detecting collisions, and decide whether to give `TaskId` a normalizing `Eq`/`Hash` so dependency and cycle validation become correct on mixed files too. Discovered while fixing the `next_task_id` colliding-id bug — that bug's bad output reached disk precisely because validation could not see the collision.
"""
implemented = 'Added validate_unique_ids (10th of 17 checks) and made TaskId Eq/Hash normalizing across Number(n)↔Text("n") canonical-key, so the same id in different disk forms (id = 1 vs id = "1") collides. Four call sites become correct on mixed-form files for free: validate_dependencies, validate_dependency_cycles, doctor.rs degenerate-bundle check, next_bundle.rs actionability memo — no edits to those sites; six new tests assert the regression on mixed forms. Cross-form error message uses TOML-literal forms (`duplicate task id "1" (already defined as 1)`) so the human can locate both lines; Display still strips quotes for the human-identity case. PartialEq<u32> also tightened to accept Text("1") == 1u32 for consistency with the normalizing Eq. Agent-grep contract substring: `duplicate task id`. Text ids that do not parse as u32 (e.g. "INE-5", "alpha") keep their own canonical key — Number(5) ≠ Text("INE-5"). No schema_version bump (purely additive validator + tighter in-memory equality; on-disk format and roundtrip unchanged). Docs: CLAUDE.md schema-invariants bullet + DESIGN.md schema-invariants paragraph.'
