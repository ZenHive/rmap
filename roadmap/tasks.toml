body = """
Authoring-time enforcement of a harness policy change (2026-06-12): harness now HARD-REJECTS any dispatch of a model-capable agent (implementer OR reviewer) that resolves to no model — it never falls through to the agent CLI's ambient/sticky default (a premium default once burned the token budget on every later run). Harness resolves the model as: task `model` pin > consumer per-agent default (`{:agent_model, agent}`) > REJECT.

Because harness now expects a model on every dispatch, rmap — which owns the authoring surface — must refuse to author a dispatch that would be rejected. A live task (`pending`/`in_progress`) routed to a real agent (`assignee` set and != `"human"`) MUST pin a `model`. This is a HARD `rmap validate` error (exit 1), not a soft advisory: the roadmap is the source of truth harness ingests, so the gate belongs at the strict layer the mutators and CI run.

Scope is narrow so it never breaks already-committed work: terminal tasks (done/superseded/blocked) are exempt (the model, or its absence, is now a historical fact), and assignee-unset / `human` tasks are exempt (no agent is chosen, so there is nothing to pin).
"""
