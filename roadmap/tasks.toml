ndles::list_bundles`-derived per-bundle state — no duplicated dep-satisfaction logic. Pure function; no I/O.", "Tests: at least (a) focus-phase wins over a higher-sum-Eff bundle in another phase, (b) ties broken by `bundle.order`, (c) bundle with all-blocked tasks is skipped, (d) bundle whose only pending task has unmet deps is skipped, (e) `--bundle <name>` force-picks even when its sum-Eff is lower, (f) JSON shape stable (snapshot or field-presence asserts), (g) topological order assertion when bundle has internal `depends_on` chain. Smoke test in `tests/skills_smoke.rs` picks up the new `SKILLS.md` example automatically.", "Doc updates: SKILLS.md gets a new example block (`rmap next-bundle`, `rmap next-bundle --json`, `rmap next-bundle --bundle <name>`). CLAUDE.md gains a Load-bearing-invariants bullet for the JSON envelope, the ranking-rule contract, the empty-pick line spelling, and the no-subsetting rule. Architecture section gets a `next_bundle.rs` entry. Files touched: src/next_bundle.rs, src/main.rs, src/export.rs, tests/cli.rs, SKILLS.md, CLAUDE.md.", "Out of scope: `--delegate <target>` for bundles (deferred to a follow-up task — needs its own design pass on how to concatenate multiple task prompts), D-budget subsetting (Option 2 — explicitly rejected), cross-bundle planning, and any change to existing `rmap next` semantics."]
