body = 'Two thin visualization/export surfaces over the existing topo graph. `rmap export dot` emits a Graphviz DOT digraph of the depends_on graph (nodes = tasks with status/Eff styling, edges = dependencies) so users can pipe to `dot`/external tools without the full --html view. `rmap waves` prints the parallel dispatch schedule by grouping tasks by dep_layer ("wave 0: [1,3,5], wave 1: [2,4], ...") — formalizing what dep_layer already encodes into the answer "given unlimited parallelism, here are the successive dispatch waves." Both read-only; --json on waves carries the layer->task-ids map.'
