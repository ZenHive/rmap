acceptance_criteria = ["`[milestones.<name>]` top-level table accepted in tasks.toml (parallel to `[phases.N]` / `[bundles.NAME]`) with fields: name, description, order, status (pending|active|done), target_version (optional)", "`Task::milestone: Option<String>` added to schema.rs; validate.rs rejects references to unknown milestone keys", "Three-place schema edit done (schema.rs + diff::diff_fields! + export::ExportedTask)", "`rmap list --milestone <name>` and `rmap next --milestone <name>` filter correctly; compose with existing `--bundle` / `--phase` / `--marker` filters", "`rmap milestones` selector listing (mirrors `rmap bundles`)", "`rmap milestone <id> <name>` mutator pins a task to a milestone; `rmap milestone <id> none` unpins; validates target exists", "`rmap render` surfaces milestone in the rendered ROADMAP.md row (placement decided during impl — column, tag prefix, or grouped section)", "`rmap show` / `rmap show --json` / `rmap delegate` include milestone when set", "Composes with phases and bundles: a task can have `phase` + `bundle` + `milestone` independently; milestones intentionally cross phases", "Schema_version bump required (new optional field is backwards-compatible at the data level but new validation rejects unknown refs)", "Round-trip and golden tests; tests/cli.rs covers the milestone mutators and validator error paths", "CHANGELOG entry + migration note in CHANGELOG.md under [Unreleased]"]
out_of_scope = ["Auto-derived milestone status from member-task statuses — decide at impl whether `rmap milestone-status` is manual-only or auto-on-all-done; if auto-derivation is added, scope it as a follow-up task, not this one", "Multiple milestones per task — one milestone per task; if work straddles release lines, split the task", "Hierarchical milestones (`v1.0/data-plane`) — flat namespace for v1; revisit if portfolio adoption surfaces a need", "Linear `Milestone` backfill via MCP — separate task; the schema lands first, sync second", "Marker-vocab expansion — milestones replace the would-be `to-prod` marker; no marker work in this task"]
body = """
rmap has phases (sequential work bundles), bundles (topical grouping), and markers (execution / delegation / quality modifiers) — but no first-class concept for *which release ships a task*. Real release lines cross phases: a `v1.0` cut typically pulls work from multiple phases while deferring others to `v-next`. Today this is unrepresentable in tasks.toml without smuggling it into markers (rejected — see § "Why not a marker") or naming-convention bundles (rejected — bundles are phase-bound by design).

Add `milestones` as a first-class top-level concept parallel to phases and bundles:

```toml
[milestones.v0_1]
name = "v0.1 — first usable"
description = "Macro-generated data plane on one exchange end-to-end"
target_version = "0.1.0"
order = 1
status = "active"

[milestones.v1_0]
name = "v1.0 — production-ready trade plane"
description = "Full unified CCXT surface incl. signed trade plane, testnet-verified"
target_version = "1.0.0"
order = 2
status = "pending"

[[task]]
id = 7
phase = 2
bundle = "macros"
milestone = "v0_1"
# ...
```

## Why not a marker

Markers describe *how* to work on a task (parallel-safe, delegate to Codex, this is a bug, this is a security item). Milestones describe *which release ships it* — a relationship to a release line, not a modifier. Marker-vocab bloat is the failure mode if we conflate the two — `to-prod`, `to-v1.0`, `to-v0.1`, `to-v2.0` would all be markers under that model, and any task without one of them becomes ambiguous (post-release? backlog? unknown?). A first-class relationship is the right shape.

## Why not a bundle

Bundles are phase-bound — `bundles.<name>.phase` is required. Release lines are explicitly cross-phase: v1.0 pulls from phases 2, 3, 4, 5 simultaneously. Twisting bundles to do this would either require dropping the phase constraint (breaking change to existing bundle semantics) or introducing fake phases for release-line grouping. Neither is clean.

## Composition with existing concepts

| Concept   | Role today                | After milestones                                |
|-----------|---------------------------|--------------------------------------------------|
| phase     | sequential work ordering  | unchanged — "what order to build"               |
| bundle    | topical grouping          | unchanged — "what belongs together"             |
| markers   | execution modifiers       | unchanged — "how to work on it"                 |
| milestone | (missing)                 | **"which release ships it"** — flat, cross-phase|

A task can carry phase + bundle + milestone independently. Queries compose: `rmap next --milestone v1_0 --bundle macros` shows the next macros-bundle task that's in the v1.0 release cut.

## Open design questions (decide during impl)

- **Status auto-derivation** — does a milestone flip to `done` automatically when all member tasks are `done`, or only via explicit `rmap milestone-status`? Lean: manual for v1, auto-derivation as a follow-up if friction surfaces.
- **ROADMAP.md render placement** — three viable shapes: (a) milestone tag in each row's prefix (like `[v1.0]`), (b) a top-level "Release Lines" section that lists each milestone with member tasks, (c) both. Lean: (a) for inline visibility + (c) only if (a) feels noisy.
- **Linear sync** — Linear has `Milestone` as a native concept reachable via `mcp__linear-server__list_milestones`. Out of scope for this task; once schema lands, a follow-up can sync.

## Migration

Schema_version bumps. Existing tasks default to `milestone = None`. No retroactive backfill — the schema lands empty and projects populate as they define their release lines. ccxt_ocx is the immediate consumer (will define `v0_1` data-plane and `v1_0` trade-plane milestones on first migration).

## Origin

Surfaced from a ccxt_ocx scoping conversation. Attempt was to add a `to-prod` marker for the "release-readiness cut," rejected as marker-vocab bloat. The deeper observation: production-readiness is the implicit goal of every roadmap task; what's actually missing is a way to pin tasks to specific release lines. Hence milestones — relationship, not tag.
"""
implemented = """Shipped [milestones.<name>] as fourth top-level concept (parallel to phases/bundles/markers), with Task::milestone Option<String> pin. Full surface: rmap milestone <id> <name|none> mutator (validate-then-write, unknown name rejected before any file mutation); rmap milestones selector listing mirroring rmap bundles (five-branch glyph ladder + trailing [target=<version>] segment, active-first sort key for the 'what release am I cutting next?' daily query); --milestone filter on rmap list / rmap next composing with --bundle/--phase/--marker; render row gains conditional '🚀 **<key>** ·' segment between bundle and module (rows without milestone render byte-identically); rmap show prints 'milestone: <key> (target=<version>)' line; rmap delegate gains conditional '- Milestone:' bullet in ## Context. Validation: VALID_MILESTONE_STATUSES = pending|active|done (distinct from task status vocab); validate_milestone_references rejects unknown task→milestone refs before any write. Three-place edit + top-level sibling edit done (schema.rs, diff::diff_fields! + TASK_VERBOSE_WHITELIST + diff_metadata::map_diff + impl MapEntry, export::ExportedTask + ExportedTasks). canonical_task_key_index gained "milestone" => 3 between bundle and status. Interactive rmap new gains a Select prompt over tasks.milestones.keys() with Skip option; --from-stdin accepts milestone field on StdinTask. Tests: 17 new (validate 3, diff 3, cli 10, delegate 3) + new golden fixture tests/golden/milestone_inline/ + skills_fixture gained [milestones.demo] so new SKILLS.md blocks execute under skills_smoke. Docs: SKILLS.md Milestones section, ~/.claude/includes/rmap.md command table + first-class subsection, DESIGN.md schema example + CLI surface + invariant, CLAUDE.md three new load-bearing invariants. Two pushbacks accepted: (1) no schema_version bump — purely additive optional fields, mirrors Phase 15 Task 19 Task::model precedent; (2) CHANGELOG style uses ### Phase 15 Task 24 header (no [Unrele