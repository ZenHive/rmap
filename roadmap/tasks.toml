[phases.16]
name = "Graph queries"
order = 16
status = "in_progress"

[bundles.graph_queries]
phase = 16
order = 1
description = "Expose the already-computed dependency graph as first-class read queries — reverse traversal (blocks/deps), computed unlock leverage, critical path, graph-health advisories, and DOT/waves export"

[bundles.import_command]
phase = 14
order = 1
description = "rmap import: emit a paste-ready ROADMAP.md→tasks.toml migration prompt (the delegate pattern, applied to migration)"

[bundles.agent_routing]
phase = 15
order = 1
description = "Per-task LLM model pinning (Task::model field, surfaced by rmap delegate)"

[bundles.schema_implemented]
phase = 15
order = 2
description = "Optional `implemented` field to record what was actually delivered vs the original task `body`"

[bundles.schema_milestones]
phase = 15
order = 3
description = "First-class milestones — release-line pin parallel to phase/bundle/markers"

[bundles.deps_schemars]
phase = 15
order = 4
description = "Upgrade schemars 0.8 → 0.9+ to emit JSON Schema draft 2020-12 instead of draft-07"

[bundles.schema_outcome]
phase = 15
order = 5
description = "Task outcome layer — delivered_by + verified fields make a done task queryable, not just readable"

[bundles.doctor_state_drift]
phase = 15
order = 6
description = "rmap doctor advisories for phase / focus state drift (read-side, no auto-mutation)"

[bundles.agent_dispatch]
phase = 15
order = 7
description = "Agent-dispatch ergonomics — make 'the set of tasks I can dispatch in parallel right now' a first-class query (rmap ready + dep_layer + handbuild/--dispatchable + touches + --fields)"

[bundles.delegate_targets]
phase = 15
order = 8
description = "Widen delegate/assignee agent set beyond claude|codex|cursor — add the local-CLI targets (grok, antigravity, pi, droid) so rmap can route to them and harness can drop its ingest two-step dance"

[bundles.attempt_history]
phase = 15
order = 9
description = "Attempt-history / rejection-report writeback — a surface for recording WHY a dispatch attempt failed on a task that returns to pending, so the next dispatcher (possibly a different agent) sees the prior attempt's evidence"

[bundles.schema_parity]
phase = 13
order = 1
description = "Phase 13b: schema additions for vision, branch, excluded-category markers, range validation"

[bundles.delegate_parity]
phase = 13
order = 2
description = "Phase 13c: delegate prompt parity with task-writing.md"

[bundles.doctor_tuning]
phase = 13
order = 3
description = "Hardcoded doctor thresholds → CLI overrides (--threshold-days, --ac-threshold)"

[bundles.batch_selection]
phase = 13
order = 4
description = "Surface authoring-time bundles as selector input (list --bundle, next --bundle, next --count)"

[bundles.bundle_selector]
phase = 13
order = 5
description = "rmap next-bundle: pick one bundle worth of dep-satisfied pending tasks for a single Claude Code session"

[bundles.html_single]
phase = 6
order = 1
description = "Single-project static HTML view at roadmap/dist/index.html"

[bundles.html_portfolio]
phase = 6
order = 2
description = "Cross-repo portfolio view (rmap render --html --multi)"

[bundles.watch_core]
phase = 7
order = 1
description = "FS-watch render loop for live dev"

[bundles.watch_stream]
phase = 7
order = 2
description = "Optional --json event stream on top of the watch loop"

